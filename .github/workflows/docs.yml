name: Docs

# The check for markdown-only changes, which ci.yml ignores. Structural
# markdown lint only — see .markdownlint-cli2.jsonc for what is disabled.

on:
  pull_request:
    branches: [main]
    paths:
      - "**.md"
  push:
    branches: [main]
    paths:
      - "**.md"

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"

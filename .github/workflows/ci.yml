name: CI

# The gate for auto-merging a bug fix. If these checks are not green, no fix
# merges on its own — see skills/fix-bug/SKILL.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the bundle
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chromium-headless-shell

      # Runs against the local Vite preview (index.html), not the live Webflow
      # site — tests/live/** is excluded by playwright.config.js.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
